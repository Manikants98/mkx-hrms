workflows:
  flutter-ios-simulator:
    name: Flutter iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    # This points Codemagic to your specific app folder:
    working_directory: mkx_hrms_mobile/apps/employee_app_ios27
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up local dependencies
        script: |
          flutter pub get
      - name: Build iOS Simulator App
        script: |
          # Compiles the simulator binary (.app file) for iPhone 15 and iOS simulators
          flutter build ios --simulator --debug --no-codesign
    artifacts:
      - mkx_hrms_mobile/apps/employee_app_ios27/build/ios/iphonesimulator/*.app
      - "**/build/ios/iphonesimulator/*.app"
      - /tmp/xcodebuild_logs/*.log
